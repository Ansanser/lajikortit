<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lajikortisto</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f3f3f3;
    }

    header {
      padding: 16px;
      background: white;
      position: sticky;
      top: 0;
      box-shadow: 0 2px 8px #0002;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    #count {
      margin-top: 4px;
      color: #666;
    }

    #cards {
      display: grid;
      gap: 14px;
      padding: 14px;
    }

    .card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 8px #0002;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: #ddd;
    }

    .content {
      padding: 14px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
    }

    .sub {
      color: #666;
      margin-top: 4px;
    }

    dialog {
      border: 0;
      border-radius: 16px;
      padding: 0;
      width: min(92vw, 540px);
      max-height: 90vh;
      overflow: auto;
    }

    dialog img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      background: #ddd;
    }

    .dialogContent {
      padding: 16px;
    }

    .field {
      margin: 12px 0;
    }

    .field strong {
      display: block;
    }

    .close {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Lajikortisto</h1>
    <div id="count"></div>
  </header>

  <main id="cards"></main>

  <dialog id="dialog">
    <div id="dialogInner"></div>
  </dialog>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTPOt4duscUsSyAKNK9gQpXTujtJ-g2FhAWRsYF9n86likzVLE6-p7tlZXPpuFIHYdxLD411oJKM9-S/pub?gid=0&single=true&output=csv";

    let rows = [];

    function parseCSV(text) {
      const result = [];
      let row = [];
      let cell = "";
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"' && insideQuotes && next === '"') {
          cell += '"';
          i++;
        } else if (c === '"') {
          insideQuotes = !insideQuotes;
        } else if (c === "," && !insideQuotes) {
          row.push(cell);
          cell = "";
        } else if ((c === "\n" || c === "\r") && !insideQuotes) {
          if (cell || row.length) {
            row.push(cell);
            result.push(row);
            row = [];
            cell = "";
          }
          if (c === "\r" && next === "\n") i++;
        } else {
          cell += c;
        }
      }

      if (cell || row.length) {
        row.push(cell);
        result.push(row);
      }

      const headers = result.shift().map(h => h.trim());

      return result
        .filter(r => r.some(c => c.trim()))
        .map(r => {
          const obj = {};
          headers.forEach((h, i) => {
            if (h) obj[h] = (r[i] || "").trim();
          });
          return obj;
        });
    }

    function title(row) {
      const heimo = row["Heimo"] || "";
      const laji = row["laji"] || "";
      return heimo ? `${heimo}: ${laji}` : laji;
    }

    function field(label, value) {
      if (!value) return "";
      return `<div class="field"><strong>${label}</strong>${value}</div>`;
    }

    function render() {
      document.getElementById("count").textContent = `${rows.length} lajia`;

      document.getElementById("cards").innerHTML = rows.map((row, i) => `
        <article class="card" onclick="openCard(${i})">
          ${row["Kuva"] ? `<img src="${row["Kuva"]}" alt="">` : ""}
          <div class="content">
            <div class="title">${title(row)}</div>
            <div class="sub">${row["Lahko"] || ""}</div>
          </div>
        </article>
      `).join("");
    }

    function openCard(i) {
      const row = rows[i];

      document.getElementById("dialogInner").innerHTML = `
        ${row["Kuva"] ? `<img src="${row["Kuva"]}" alt="">` : ""}
        <div class="dialogContent">
          <h2>${title(row)}</h2>
          ${field("Lahko", row["Lahko"])}
          ${field("Heimo", row["Heimo"])}
          ${field("Biotooppi", row["biotooppi"])}
          ${field("Yleisyys", row["yleisyys"])}
          ${field("Etsiminen", row["etsiminen"])}
          ${field("Tuntomerkit suhteessa lähilajeihin", row["tuntomerkit suhteessa lähilajeihin"])}
          ${field("Päivämäärä", row["Päivämäärä"])}
          ${field("Paikka", row["Paikka"])}
          <button class="close" onclick="document.getElementById('dialog').close()">Sulje</button>
        </div>
      `;

      document.getElementById("dialog").showModal();
    }

 async function load() {
  try {
    const proxiedUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(SHEET_CSV_URL);
    const res = await fetch(proxiedUrl);
    const text = await res.text();
    rows = parseCSV(text);
    render();
  } catch (error) {
    document.getElementById("cards").innerHTML =
      "<p>Dataa ei saatu ladattua. Tarkista Google Sheetsin CSV-julkaisulinkki.</p>";
  }
}

    load();
  </script>
</body>
</html>
